[tool.poetry]
name = "ticketgen"
version = "1.0.0"
description = "Генератор вариантов экзаменационных билетов"
authors = ["Репенко Ярослав"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
pyqt6 = "^6.7"
python-docx = "^1.1"
reportlab = "^4.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
black = "^24.0"
flake8 = "^7.0"
pre-commit = "^3.7"

[tool.black]
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
